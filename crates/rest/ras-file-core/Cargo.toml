[package]
name = "ras-file-core"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Core runtime types for Rust API Stack file upload and download services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming::http-server"]
keywords = ["file-upload", "download", "multipart", "api", "axum"]

[dependencies]
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
httpdate = "1.0"
ras-auth-core = { path = "../../core/ras-auth-core", version = "0.3.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
