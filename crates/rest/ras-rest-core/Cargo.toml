[package]
name = "ras-rest-core"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
description = "Runtime types for REST services generated by ras-rest-macro"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming::http-server"]
keywords = ["rest", "api", "openapi", "axum"]

[dependencies]
ras-spec-components = { path = "../../specs/ras-spec-components", version = "0.1.0" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ras-auth-core = { path = "../../core/ras-auth-core", version = "0.3.0" }
ras-version-core = { path = "../../core/ras-version-core", version = "0.1.0" }
