[package]
name = "ras-jsonrpc-core"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Runtime support for JSON-RPC services generated by ras-jsonrpc-macro"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming::http-server", "network-programming"]
keywords = ["jsonrpc", "json-rpc", "rpc", "api", "axum"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ras-jsonrpc-types = { path = "../ras-jsonrpc-types", version = "0.3.0" }
ras-auth-core = { path = "../../core/ras-auth-core", version = "0.3.0" }
ras-version-core = { path = "../../core/ras-version-core", version = "0.1.0" }
tracing = { workspace = true }
