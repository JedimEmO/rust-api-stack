[package]
name = "ras-jsonrpc-types"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "JSON-RPC 2.0 protocol types and utilities"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming", "encoding"]
keywords = ["jsonrpc", "json-rpc", "rpc", "serde", "protocol"]

[dependencies]
ras-spec-components = { path = "../../specs/ras-spec-components", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
