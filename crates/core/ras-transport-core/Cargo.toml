[package]
name = "ras-transport-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "HTTP transport for generated Rust API Stack clients: reqwest in production, axum-test in tests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming::http-client", "wasm"]
keywords = ["http", "client", "transport", "reqwest", "wasm"]

[package.metadata.docs.rs]
# The reqwest and axum-test transports are behind features; document them too.
all-features = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
getrandom = "0.2"
futures-core = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, optional = true }
axum-test = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
# `js` lets `getrandom` source entropy from the browser crypto API on wasm.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }

[features]
default = []
reqwest = ["dep:reqwest"]
fs = ["dep:tokio", "dep:tokio-util"]
axum-test = ["dep:axum-test"]
