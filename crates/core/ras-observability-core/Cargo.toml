[package]
name = "ras-observability-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Traits and types for request metrics and usage tracking in Rust API Stack services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JedimEmO/rust-api-stack"
homepage = "https://github.com/JedimEmO/rust-api-stack"
readme = "README.md"
categories = ["web-programming", "development-tools::profiling"]
keywords = ["observability", "metrics", "api", "axum"]

[dependencies]
ras-auth-core = { path = "../ras-auth-core", version = "0.3.0" }
async-trait = { workspace = true }
serde = { workspace = true }
http = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "macros", "rt-multi-thread"] }
serde_json = { workspace = true }
